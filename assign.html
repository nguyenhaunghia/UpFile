<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Công - UpFile System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="dashboard-header">
        <div class="brand-section">
            <div class="brand-logo">🚀 UpFile <span style="font-size:0.9rem; opacity:0.7; font-weight:500;">/ Phân Công</span></div>
            <a href="index.html" class="btn btn-secondary btn-sm" style="margin-left:10px;"> Quay lại</a>
        </div>
        <div class="user-section">
            <div class="user-info-text">
                <span class="user-name" id="displayUserName">Admin</span>
                <span class="user-role-badge admin" id="displayUserRole">Admin</span>
            </div>
            <div class="user-avatar" id="userAvatar">A</div>
        </div>
    </header>

    <main class="main-container" style="padding-bottom: 90px;">
        
        <div class="card-box">
            <div class="card-header-title">1. Thiết lập thông tin hồ sơ</div>
            <div class="filter-grid" id="part1Container">
                <div class="filter-item">
                    <label>Năm học <span style="color:red">*</span></label>
                    <select id="selYear" class="required-select"></select>
                </div>
                <div class="filter-item">
                    <label>Kỳ kiểm tra <span style="color:red">*</span></label>
                    <select id="selFolder" class="required-select"></select>
                </div>
                <div class="filter-item">
                    <label>Môn học <span style="color:red">*</span></label>
                    <select id="selSubject" class="required-select"></select>
                </div>
                <div class="filter-item">
                    <label>Khối <span style="color:red">*</span></label>
                    <select id="selBlock" class="required-select"></select>
                </div>
                <div class="filter-item">
                    <label>Đối tượng <span style="color:red">*</span></label>
                    <select id="selObject" class="required-select"></select>
                </div>
            </div>
        </div>

        <div class="card-box section-disabled" id="part2Container">
            <div class="card-header-title" style="justify-content: space-between;">
                <span>2. Chọn Giáo viên & Nội dung nộp</span>
                <small style="color:#666; font-weight:400; font-size:0.9rem;">Tích chọn giáo viên để mở nội dung</small>
            </div>
            
            <div class="assign-table-wrapper">
                <table class="assign-table">
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align:center;">Chọn</th>
                            <th style="width: 250px;">Thông tin Giáo viên (Upload)</th>
                            <th>Nội dung (DocType) cần nộp</th>
                            <th style="width: 200px;">Người giám sát</th>
                        </tr>
                    </thead>
                    <tbody id="teacherBody">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 40px; color:#999;">
                                <div class="spinner" style="margin:0 auto 10px;"></div>
                                Đang tải danh sách...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <div class="sticky-footer">
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">Hủy bỏ</button>
        <button class="btn btn-primary" id="btnSave" onclick="handleSaveAssign()" disabled>💾 Xác nhận & Lưu Phân công</button>
    </div>
    <script src="common.js"></script>
    <script src="pages.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('upfile_user');
            if (userStr) {
                const user = JSON.parse(userStr);
                if (user.Permissions !== 'Admin') {
                    showToast('Bạn không có quyền truy cập trang này!', 'error');
                    setTimeout(() => window.location.href = 'index.html', 1500); 
                    return;
                }
            } else {
                window.location.href = 'login.html';
            }
            initAssignPage();
        });
    </script>
</body>
</html>
